name: Build Temperature Alert APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Setup Android Project Files & Wrapper
      run: |
        mkdir -p app/src/main/java/com/temp/alert
        mkdir -p app/src/main/res/layout
        mkdir -p app/src/main/res/values

        # Root build.gradle
        cat << 'EOF' > build.gradle
        buildscript {
            repositories { google(); mavenCentral() }
            dependencies { classpath 'com.android.tools.build:gradle:8.1.1' }
        }
        allprojects {
            repositories { google(); mavenCentral() }
        }
        EOF

        # app/build.gradle
        cat << 'EOF' > app/build.gradle
        plugins {
            id 'com.android.application'
        }
        android {
            namespace 'com.temp.alert'
            compileSdk 34
            defaultConfig {
                applicationId "com.temp.alert"
                minSdk 21
                targetSdk 34
                versionCode 1
                versionName "1.0"
            }
            buildTypes {
                release {
                    minifyEnabled false
                }
            }
            compileOptions {
                sourceCompatibility JavaVersion.VERSION_17
                targetCompatibility JavaVersion.VERSION_17
            }
        }
        dependencies {
            implementation 'androidx.appcompat:appcompat:1.6.1'
            implementation 'com.google.android.material:material:1.9.0'
        }
        EOF

        # settings.gradle
        cat << 'EOF' > settings.gradle
        include ':app'
        EOF

        # AndroidManifest.xml
        cat << 'EOF' > app/src/main/AndroidManifest.xml
        <?xml version="1.0" encoding="utf-8"?>
        <manifest xmlns:android="http://schemas.android.com/apk/res/android"
            package="com.temp.alert">

            <uses-permission android:name="android.permission.POST_NOTIFICATIONS" />
            <uses-permission android:name="android.permission.FOREGROUND_SERVICE" />

            <application
                android:allowBackup="true"
                android:icon="@mipmap/ic_launcher"
                android:label="Temp Alert"
                android:supportsRtl="true"
                android:theme="@style/Theme.AppCompat.Light.DarkActionBar">

                <activity
                    android:name=".MainActivity"
                    android:exported="true">
                    <intent-filter>
                        <action android:name="android.intent.action.MAIN" />
                        <category android:name="android.intent.category.LAUNCHER" />
                    </intent-filter>
                </activity>

                <service android:name=".TempMonitorService" android:exported="false" />
            </application>
        </manifest>
        EOF

        # Strings.xml
        cat << 'EOF' > app/src/main/res/values/strings.xml
        <resources>
            <string name="app_name">Temp Alert</string>
        </resources>
        EOF

        # Layout XML
        cat << 'EOF' > app/src/main/res/layout/activity_main.xml
        <?xml version="1.0" encoding="utf-8"?>
        <LinearLayout xmlns:android="http://schemas.android.com/apk/res/android"
            android:layout_width="match_parent"
            android:layout_height="match_parent"
            android:orientation="vertical"
            android:gravity="center"
            android:padding="20dp">

            <TextView
                android:id="@+id/txtTemp"
                android:layout_width="wrap_content"
                android:layout_height="wrap_content"
                android:text="Checking Temp..."
                android:textSize="28sp"
                android:textStyle="bold" />

            <Button
                android:id="@+id/btnStart"
                android:layout_width="wrap_content"
                android:layout_height="wrap_content"
                android:layout_marginTop="20dp"
                android:text="Start Service" />
        </LinearLayout>
        EOF

        # MainActivity.java
        cat << 'EOF' > app/src/main/java/com/temp/alert/MainActivity.java
        package com.temp.alert;

        import android.content.BroadcastReceiver;
        import android.content.Context;
        import android.content.Intent;
        import android.content.IntentFilter;
        import android.os.BatteryManager;
        import android.os.Bundle;
        import android.widget.Button;
        import android.widget.TextView;
        import androidx.appcompat.app.AppCompatActivity;

        public class MainActivity extends AppCompatActivity {
            private TextView txtTemp;

            @Override
            protected void onCreate(Bundle savedInstanceState) {
                super.onCreate(savedInstanceState);
                setContentView(R.layout.activity_main);

                txtTemp = findViewById(R.id.txtTemp);
                Button btnStart = findViewById(R.id.btnStart);

                btnStart.setOnClickListener(v -> {
                    Intent serviceIntent = new Intent(this, TempMonitorService.class);
                    startService(serviceIntent);
                });

                registerReceiver(batteryReceiver, new IntentFilter(Intent.ACTION_BATTERY_CHANGED));
            }

            private final BroadcastReceiver batteryReceiver = new BroadcastReceiver() {
                @Override
                public void onReceive(Context context, Intent intent) {
                    int temp = intent.getIntExtra(BatteryManager.EXTRA_TEMPERATURE, 0);
                    float cel = temp / 10.0f;
                    txtTemp.setText("Temp: " + cel + " °C");
                }
            };
        }
        EOF

        # TempMonitorService.java
        cat << 'EOF' > app/src/main/java/com/temp/alert/TempMonitorService.java
        package com.temp.alert;

        import android.app.NotificationChannel;
        import android.app.NotificationManager;
        import android.app.Service;
        import android.content.BroadcastReceiver;
        import android.content.Context;
        import android.content.Intent;
        import android.content.IntentFilter;
        import android.os.BatteryManager;
        import android.os.Build;
        import android.os.IBinder;
        import androidx.core.app.NotificationCompat;

        public class TempMonitorService extends Service {
            private static final String CHANNEL_ID = "temp_alert_channel";
            private static final float TEMP_THRESHOLD = 40.0f;

            @Override
            public void onCreate() {
                super.onCreate();
                createNotificationChannel();
                registerReceiver(batteryReceiver, new IntentFilter(Intent.ACTION_BATTERY_CHANGED));
            }

            private final BroadcastReceiver batteryReceiver = new BroadcastReceiver() {
                @Override
                public void onReceive(Context context, Intent intent) {
                    int temp = intent.getIntExtra(BatteryManager.EXTRA_TEMPERATURE, 0);
                    float cel = temp / 10.0f;

                    if (cel >= TEMP_THRESHOLD) {
                        sendHighTempAlert(cel);
                    }
                }
            };

            private void sendHighTempAlert(float currentTemp) {
                NotificationManager manager = (NotificationManager) getSystemService(Context.NOTIFICATION_SERVICE);
                NotificationCompat.Builder builder = new NotificationCompat.Builder(this, CHANNEL_ID)
                        .setSmallIcon(android.R.drawable.stat_sys_warning)
                        .setContentTitle("🔥 High Temperature Alert!")
                        .setContentText("Phone Temperature is " + currentTemp + "°C. Please let it cool down!")
                        .setPriority(NotificationCompat.PRIORITY_HIGH);

                if (manager != null) {
                    manager.notify(101, builder.build());
                }
            }

            private void createNotificationChannel() {
                if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.O) {
                    NotificationChannel channel = new NotificationChannel(
                            CHANNEL_ID,
                            "Temperature Alerts",
                            NotificationManager.IMPORTANCE_HIGH
                    );
                    NotificationManager manager = getSystemService(NotificationManager.class);
                    if (manager != null) {
                        manager.createNotificationChannel(channel);
                    }
                }
            }

            @Override
            public int onStartCommand(Intent intent, int flags, int startId) {
                return START_STICKY;
            }

            @Override
            public IBinder onBind(Intent intent) {
                return null;
            }
        }
        EOF

        # Download Official Gradle 8.1.1 Wrapper Zip & Setup gradlew script directly
        curl -sL https://services.gradle.org/distributions/gradle-8.1.1-bin.zip -o gradle.zip
        unzip -q gradle.zip
        ./gradle-8.1.1/bin/gradle wrapper --gradle-version 8.1.1
        chmod +x gradlew

    - name: Build Debug APK
      run: ./gradlew assembleDebug

    - name: Upload APK to Artifacts
      uses: actions/upload-artifact@v4
      with:
        name: TempAlertApp-APK
        path: app/build/outputs/apk/debug/app-debug.apk
